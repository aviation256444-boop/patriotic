# Render Blueprint — keep this minimal so sync succeeds.
# Add secrets later in the Dashboard → Environment.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: patriotic-youths-uganda
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_APP_NAME
        value: Patriotic Youths of Uganda
      - key: NEXT_PUBLIC_SQUARE_ENABLED
        value: "true"
      - key: SQUARE_ENV
        value: production
      - key: NEXT_PUBLIC_SQUARE_ENV
        value: production
      - key: SQUARE_LOCATION_CURRENCY
        value: USD
      - key: SQUARE_UGX_PER_USD
        value: "3700"
      - key: NEXT_PUBLIC_MOMO_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_MOMO_CURRENCY
        value: UGX
      - key: AUTH_SECRET
        generateValue: true
