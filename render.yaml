# Service: patriotic-app
# Public URL: https://patriotic-app.onrender.com
# Repo: https://github.com/aviation256444-boop/patriotic (branch main)
# Set secrets in Dashboard → Environment (do not commit):
#   DATABASE_URL   — Postgres (Neon free / Render Postgres) — REQUIRED for data that survives redeploys
#   PAWAPAY_API_TOKEN
#   optional Cloudinary
# See DATABASE.md
services:
  - type: web
    name: patriotic-app
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # Install devDeps so TypeScript / types are available at build time
    buildCommand: npm ci --legacy-peer-deps --include=dev --no-audit --no-fund || npm install --legacy-peer-deps --include=dev --no-audit --no-fund; npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        # Free-tier builds OOM around 460MB during Next typecheck if enabled.
        # Keep headroom for webpack; typecheck skipped in next.config.
        value: --max-old-space-size=480
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_APP_NAME
        value: Patriotic Youths of Uganda
      - key: NEXT_PUBLIC_APP_URL
        value: https://patriotic-app.onrender.com
      # Public Google OAuth Web Client ID (account picker on login/register)
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 868445110488-pj1f968b1a5f444bva2hkl9gc4v550uu.apps.googleusercontent.com
      - key: NEXT_PUBLIC_PAWAPAY_ENABLED
        value: "true"
      - key: PAWAPAY_ENV
        value: production
      - key: NEXT_PUBLIC_PAWAPAY_ENV
        value: production
      - key: PAWAPAY_BASE_URL
        value: https://api.pawapay.io
      - key: PAWAPAY_COUNTRY
        value: UGA
      - key: PAWAPAY_CURRENCY
        value: UGX
      - key: NEXT_PUBLIC_SQUARE_ENABLED
        value: "true"
      - key: SQUARE_ENV
        value: production
      - key: NEXT_PUBLIC_SQUARE_ENV
        value: production
      - key: SQUARE_LOCATION_CURRENCY
        value: USD
      - key: SQUARE_UGX_PER_USD
        value: "3700"
      - key: NEXT_PUBLIC_MOMO_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_MOMO_CURRENCY
        value: UGX
      - key: NEXT_PUBLIC_AIRTEL_ENABLED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      # Show email OTP on-screen when Resend email is not configured
      - key: AUTH_SHOW_OTP
        value: "true"
      # Postgres — set in Dashboard (Neon free tier recommended). Without it, JSON files are wiped on redeploy.
      # - key: DATABASE_URL
      #   sync: false
